<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MMS Blox - Create & Play Games</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #f2f4f5; --card: #ffffff; --nav: #191b1d; --green: #00b06f;
            --blue: #0059b3; --red: #ff4d4d; --gold: #f7ba2c; --text: #393b3d;
            --text2: #8c8e92; --border: #dcddde; --shadow: 0 1px 4px rgba(0,0,0,0.08);
            --radius: 8px; --radius2: 12px; --font: 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif;
        }
        body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; line-height:1.4; font-size:14px; }
        #app { width:100%; min-height:100vh; }
        .topnav { position:fixed; top:0; left:0; right:0; height:56px; background:var(--nav); display:flex; align-items:center; padding:0 20px; z-index:1000; gap:12px; }
        .topnav .logo { display:flex; align-items:center; gap:8px; cursor:pointer; flex-shrink:0; }
        .topnav .logo .sq { width:32px; height:32px; background:#e2231a; border-radius:6px; transform:rotate(5deg); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:11px; }
        .topnav .logo span { color:#fff; font-weight:700; font-size:18px; }
        .topnav .search { flex:1; max-width:500px; position:relative; }
        .topnav .search input { width:100%; padding:8px 14px 8px 36px; border-radius:20px; border:none; background:#2d3238; color:#fff; font-size:14px; outline:none; }
        .topnav .search input::placeholder { color:#888; }
        .topnav .search .sicon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#888; }
        .topnav .icons { display:flex; gap:16px; align-items:center; color:#ccc; font-size:18px; cursor:pointer; flex-shrink:0; }
        .topnav .icons .avthumb { width:32px; height:32px; border-radius:50%; background:#555; border:2px solid #888; overflow:hidden; display:flex; align-items:center; justify-content:center; font-weight:bold; color:white; background:#2c3e50; }
        .main-content { margin-top:56px; min-height:calc(100vh - 56px); }
        .page { display:none; padding:20px; max-width:1200px; margin:0 auto; }
        .page.active { display:block; }
        .card { background:var(--card); border-radius:var(--radius2); box-shadow:var(--shadow); padding:24px; margin-bottom:16px; }
        .btn { display:inline-block; padding:10px 20px; border-radius:var(--radius); font-weight:600; font-size:14px; cursor:pointer; border:none; transition:0.2s; }
        .btn-green { background:linear-gradient(180deg,#00b06f 0%,#009a5e 100%); color:#fff; }
        .btn-green:hover { background:#00a868; }
        .btn-white { background:#fff; border:1px solid var(--border); color:var(--text); }
        .btn-red { background:var(--red); color:#fff; }
        .btn-sm { padding:6px 14px; font-size:13px; border-radius:6px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
        .game-card { background:#fff; border-radius:var(--radius2); overflow:hidden; box-shadow:var(--shadow); cursor:pointer; transition:transform 0.2s; }
        .game-card:hover { transform:translateY(-4px); }
        .game-card .thumb { width:100%; aspect-ratio:16/9; background:#2c3e50; display:flex; align-items:center; justify-content:center; color:white; font-size:28px; position:relative; }
        .game-card .info { padding:12px; }
        .game-card .info .title { font-weight:700; font-size:16px; margin-bottom:4px; }
        .game-card .info .meta { font-size:12px; color:var(--text2); }
        .badge-verified { display:inline-block; width:18px; height:18px; background:#3399ff; border-radius:4px; color:#fff; font-size:10px; text-align:center; line-height:18px; margin-left:4px; }
        .grid-editor { display:grid; grid-template-columns:repeat(20, 30px); gap:2px; background:#ddd; padding:4px; border-radius:8px; overflow-x:auto; max-height:400px; }
        .grid-cell { width:30px; height:30px; background:#f0f0f0; border-radius:4px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:0.1s; font-size:16px; }
        .grid-cell.coin { background:#f7ba2c; }
        .grid-cell.hazard { background:#e2231a; }
        .grid-cell.empty:hover { background:#ccc; }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:2000; display:flex; align-items:center; justify-content:center; }
        .modal { background:#fff; border-radius:var(--radius2); padding:28px; max-width:500px; width:90%; }
        .toast { position:fixed; bottom:20px; right:20px; background:#333; color:#fff; padding:12px 20px; border-radius:var(--radius); z-index:3000; animation:fadeInOut 3s forwards; }
        @keyframes fadeInOut { 0%{opacity:0;transform:translateY(20px)} 10%{opacity:1} 80%{opacity:1} 100%{opacity:0} }
        .tab-nav { display:flex; gap:0; border-bottom:2px solid #e0e0e0; margin-bottom:16px; }
        .tab-nav .tab { padding:10px 20px; cursor:pointer; border-bottom:2px solid transparent; font-weight:600; color:var(--text2); }
        .tab-nav .tab.active { color:var(--text); border-bottom-color:var(--text); }
        input, textarea, select { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; }
        .flex { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    </style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
    const FIREBASE_ACTIVE = 'https://mms-blox-default-rtdb.firebaseio.com/';
    const ADMIN_USERNAME = 'MMSBlox';

    function uuid() { return 'xxxx-4xxx-yxxx'.replace(/[xy]/g, c => (c==='x'?Math.random()*16|0:(Math.random()*16&0x3|0x8)).toString(16)); }
    function nowISO() { return new Date().toISOString(); }
    function hash() { return window.location.hash.slice(1) || 'login'; }
    function navigate(h) { window.location.hash = h; }
    function showToast(msg) { const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
    
    let DB = {
        _data: null,
        init() {
            const stored = localStorage.getItem('mmsblox_db_v2');
            if(stored) try{ this._data = JSON.parse(stored); }catch(e){ this._data = {}; }
            if(!this._data) this._data={};
            if(!this._data.users) this._data.users = [];
            if(!this._data.reports) this._data.reports = [];
            if(!this._data.groups) this._data.groups = this._genGroups();
            if(!this._data.messages) this._data.messages = {};
            if(!this._data.verificationRequests) this._data.verificationRequests = [];
            if(!this._data.userGames) this._data.userGames = [];
            this._ensureAdmin();
            this._initSampleGames();
            this.save();
        },
        _ensureAdmin() {
            if(!this._data.users.find(u=>u.username===ADMIN_USERNAME)){
                this._data.users.push({ id:'admin-001', username:ADMIN_USERNAME, displayName:'MMSBlox', password:'admin123', isAdmin:true, isModerator:true, verifiedBadge:true, emailVerified:true, created:nowISO(), avatar:{ headColor:'#f5cba7', torsoColor:'#2c3e50', legColor:'#1a252f' }, friends:[], groups:[], warnings:[], ban:null });
            }
        },
        _initSampleGames() {
            if(this._data.userGames.length === 0){
                this._data.userGames.push({
                    id:'sample1', name:'✨ Coin Collector', description:'Collect all golden coins! Avoid red traps.', authorId:'admin-001', authorName:'MMSBlox', published:true, createdAt:nowISO(),
                    gameData:{ type:'collect', startPos:{x:0,z:0}, coins: [{x:3,z:2},{x:-2,z:4},{x:5,z:-1},{x:-3,z:-2},{x:0,z:5},{x:4,z:-4}], hazards:[{x:-1,z:-1},{x:2,z:-3},{x:-4,z:1}] }
                });
                this._data.userGames.push({
                    id:'sample2', name:'🏃‍♂️ Speed Run', description:'Dodge hazards and collect 5 gems.', authorId:'admin-001', authorName:'MMSBlox', published:true, createdAt:nowISO(),
                    gameData:{ type:'collect', startPos:{x:0,z:0}, coins: [{x:2,z:1},{x:-2,z:2},{x:4,z:0},{x:-3,z:-2},{x:1,z:-4}], hazards:[{x:0,z:3},{x:-1,z:-3},{x:3,z:-1},{x:-2,z:-1}] }
                });
            }
        },
        _genGroups() {
            return [{ id:'group-1', name:'MMS Builders', owner:'MMSBlox', members:120, description:'Game devs' }];
        },
        save() { localStorage.setItem('mmsblox_db_v2', JSON.stringify(this._data)); this._syncFirebase(); },
        _syncFirebase() { try{ fetch(FIREBASE_ACTIVE + 'backup.json', {method:'PUT', body:JSON.stringify({users:this._data.users})}); }catch(e){} },
        getUser(id) { return this._data.users.find(u=>u.id===id); },
        getUserByUsername(uname) { return this._data.users.find(u=>u.username.toLowerCase()===uname.toLowerCase()); },
        addUser(user) { this._data.users.push(user); this.save(); },
        updateUser(id,updates) { const u=this.getUser(id); if(u){ Object.assign(u,updates); this.save(); } },
        addReport(r) { this._data.reports.push(r); this.save(); },
        addVerificationRequest(vr) { this._data.verificationRequests.push(vr); this.save(); },
        getVerificationRequests() { return this._data.verificationRequests; },
        updateVerificationRequest(id,updates) { const idx=this._data.verificationRequests.findIndex(v=>v.id===id); if(idx!==-1){ Object.assign(this._data.verificationRequests[idx],updates); this.save(); } },
        getMessages(uid) { return this._data.messages[uid] || []; },
        addMessage(uid,msg) { if(!this._data.messages[uid]) this._data.messages[uid]=[]; this._data.messages[uid].push(msg); this.save(); },
        addGame(game) { this._data.userGames.push(game); this.save(); },
        updateGame(id,updated) { const idx=this._data.userGames.findIndex(g=>g.id===id); if(idx!==-1){ this._data.userGames[idx]=updated; this.save(); } },
        deleteGame(id) { this._data.userGames = this._data.userGames.filter(g=>g.id!==id); this.save(); }
    };

    let Auth = {
        sessionUser: null,
        init() { const t=localStorage.getItem('mms_session'); if(t){ const s=JSON.parse(t); const u=DB.getUser(s.userId); if(u && !u.ban) this.sessionUser=u; else this.logout(); } },
        login(username,password) {
            const u=DB.getUserByUsername(username);
            if(!u) return { success:false, error:'Invalid credentials' };
            if(u.ban) return { success:false, error:`Banned: ${u.ban.reason}`, banned:true };
            if(u.password !== password) return { success:false, error:'Wrong password' };
            this.sessionUser=u;
            localStorage.setItem('mms_session', JSON.stringify({ userId:u.id }));
            return { success:true, user:u };
        },
        register(username,password,dob) {
            if(username.length<3) return { success:false, error:'Username too short' };
            if(DB.getUserByUsername(username)) return { success:false, error:'Username taken' };
            if(password.length<6) return { success:false, error:'Password min 6 chars' };
            const user = { id:uuid(), username, displayName:username, password, isAdmin:false, isModerator:false, verifiedBadge:false, emailVerified:false, created:nowISO(), avatar:{ headColor:'#f5cba7', torsoColor:'#3498db', legColor:'#2c3e50' }, friends:[], groups:[], warnings:[], ban:null };
            DB.addUser(user);
            this.sessionUser=user;
            localStorage.setItem('mms_session', JSON.stringify({ userId:user.id }));
            return { success:true, user };
        },
        logout() { this.sessionUser=null; localStorage.removeItem('mms_session'); navigate('login'); },
        isLoggedIn() { return !!this.sessionUser && !this.sessionUser.ban; },
        isAdmin() { return this.sessionUser && (this.sessionUser.isAdmin || this.sessionUser.username===ADMIN_USERNAME); },
        isMod() { return this.sessionUser && (this.sessionUser.isModerator || this.isAdmin()); }
    };

    class App {
        constructor() { this.appEl=document.getElementById('app'); window.addEventListener('hashchange',()=>this.route()); this.route(); }
        route(){
            const h=hash();
            if(!Auth.isLoggedIn() && !['login','register'].includes(h)){ navigate('login'); return; }
            if(Auth.isLoggedIn() && ['login','register'].includes(h)){ navigate('home'); return; }
            if(Auth.sessionUser?.ban && h!=='ban'){ navigate('ban'); return; }
            this.render(h);
        }
        render(page){
            this.appEl.innerHTML='';
            if(Auth.isLoggedIn() && !['login','register','ban'].includes(page)) this._renderNav();
            const main=document.createElement('div'); main.className='main-content';
            if(page==='login') this._renderLogin(main);
            else if(page==='register') this._renderRegister(main);
            else if(page==='ban') this._renderBan(main);
            else if(page==='home') this._renderHome(main);
            else if(page==='discover') this._renderDiscover(main);
            else if(page==='avatar') this._renderAvatar(main);
            else if(page==='create') this._renderGameStudio(main);
            else if(page==='settings') this._renderSettings(main);
            else if(page==='profile') this._renderProfile(main);
            else if(page==='friends') this._renderFriends(main);
            else if(page==='messages') this._renderMessages(main);
            else if(page==='groups') this._renderGroups(main);
            else if(page==='admin') this._renderAdmin(main);
            else if(page==='moderation') this._renderModeration(main);
            else if(page.startsWith('game')) this._renderPlayGame(main);
            else this._renderHome(main);
            this.appEl.appendChild(main);
            if(page==='avatar') this._initAvatar3D();
        }
        _renderNav(){
            const nav=document.createElement('nav'); nav.className='topnav';
            nav.innerHTML=`
            <div class="logo" onclick="navigate('home')"><div class="sq">MMS</div><span>MMS Blox</span></div>
            <div class="search"><span class="sicon">🔍</span><input type="text" id="navSearch" placeholder="Search games..."></div>
            <div class="icons">
                <span onclick="navigate('messages')">✉</span>
                <span onclick="navigate('friends')">👥</span>
                <span onclick="navigate('create')">🎮 Create</span>
                <span onclick="navigate('settings')">⚙</span>
                <div class="avthumb" onclick="navigate('profile')">${(Auth.sessionUser?.username||'?')[0].toUpperCase()}</div>
                ${Auth.isAdmin()?'<span onclick="navigate(\'admin\')" style="color:#e2231a;">🛡</span>':''}
                <span onclick="Auth.logout()" style="color:#ff4d4d;">🚪</span>
            </div>`;
            this.appEl.appendChild(nav);
            setTimeout(()=>{
                const sb=document.getElementById('navSearch');
                if(sb) sb.addEventListener('keydown',e=>{ if(e.key==='Enter') navigate('discover?q='+encodeURIComponent(sb.value)); });
            },50);
        }
        _renderLogin(main){
            main.style.cssText='display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1a1a2e;';
            main.innerHTML=`<div style="background:#fff;border-radius:16px;padding:32px;width:400px;"><h2>MMS Blox</h2><input id="loginUser" placeholder="Username"><br><br><input id="loginPass" type="password" placeholder="Password"><br><br><button class="btn btn-green" id="loginBtn">Log In</button><div id="loginError" style="color:red;margin-top:8px;"></div><p style="margin-top:12px;">Demo: MMSBlox / admin123</p><span onclick="navigate('register')">Sign Up</span></div>`;
            document.getElementById('loginBtn')?.addEventListener('click',()=>{
                const u=document.getElementById('loginUser').value, p=document.getElementById('loginPass').value;
                const res=Auth.login(u,p);
                if(res.success) navigate('home');
                else document.getElementById('loginError').innerText=res.error;
            });
        }
        _renderRegister(main){
            main.style.cssText='display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1a1a2e;';
            main.innerHTML=`<div style="background:#fff;border-radius:16px;padding:32px;width:400px;"><h2>Register</h2><input id="regUser" placeholder="Username"><br><br><input id="regPass" type="password" placeholder="Password"><br><br><input id="regPass2" type="password" placeholder="Confirm"><br><br><button class="btn btn-green" id="regBtn">Create</button><div id="regError" style="color:red;"></div></div>`;
            document.getElementById('regBtn')?.addEventListener('click',()=>{
                const u=document.getElementById('regUser').value, p=document.getElementById('regPass').value, p2=document.getElementById('regPass2').value;
                if(p!==p2){ document.getElementById('regError').innerText='Passwords mismatch'; return; }
                const res=Auth.register(u,p,'2000-01-01');
                if(res.success) navigate('home'); else document.getElementById('regError').innerText=res.error;
            });
        }
        _renderBan(main){ main.innerHTML=`<div class="card"><h2>Account Banned</h2><p>${Auth.sessionUser?.ban?.reason || 'Violation'}</p><button class="btn btn-red" onclick="Auth.logout()">Logout</button></div>`; }
        _renderHome(main){
            const games = DB._data.userGames.filter(g=>g.published).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
            main.innerHTML=`<div class="page active"><h2>🎮 Featured Games</h2><div class="grid">${games.slice(0,6).map(g=>`
                <div class="game-card" onclick="navigate('game?id=${g.id}')"><div class="thumb">🎲</div><div class="info"><div class="title">${g.name}</div><div class="meta">by ${g.authorName} · ${g.gameData.coins?.length||0} coins</div></div></div>
            `).join('')||'<div class="card">No games yet. <a onclick="navigate(\'create\')">Create one!</a></div>'}</div><h3>Popular</h3><div class="grid">${games.slice(0,6).map(g=>`<div class="game-card" onclick="navigate('game?id=${g.id}')"><div class="thumb">🏆</div><div class="info"><div>${g.name}</div></div></div>`).join('')}</div></div>`;
        }
        _renderDiscover(main){
            const q = new URLSearchParams(window.location.hash.split('?')[1]||'').get('q')||'';
            let games = DB._data.userGames.filter(g=>g.published);
            if(q) games = games.filter(g=>g.name.toLowerCase().includes(q.toLowerCase()));
            main.innerHTML=`<div class="page active"><h2>Discover Games</h2><div class="grid">${games.map(g=>`<div class="game-card" onclick="navigate('game?id=${g.id}')"><div class="thumb">🎯</div><div class="info"><b>${g.name}</b><br>by ${g.authorName}</div></div>`).join('')||'<p>No games found</p>'}</div></div>`;
        }
        _renderAvatar(main){
            const u=Auth.sessionUser;
            main.innerHTML=`<div class="page active"><div class="card"><div id="avatar3DContainer" style="height:400px;background:#ddd;border-radius:12px;"></div><div><label>Head</label><input type="color" id="headColor" value="${u.avatar.headColor}" onchange="App.instance._updateAvatarColor('headColor',this.value)"><label>Torso</label><input type="color" id="torsoColor" value="${u.avatar.torsoColor}" onchange="App.instance._updateAvatarColor('torsoColor',this.value)"></div></div></div>`;
            this._avatarColors = { headColor:u.avatar.headColor, torsoColor:u.avatar.torsoColor, legColor:u.avatar.legColor };
            setTimeout(()=>this._initAvatar3D(),100);
        }
        _initAvatar3D(){
            const c=document.getElementById('avatar3DContainer'); if(!c||!window.THREE) return;
            c.innerHTML=''; const w=c.clientWidth,h=400; const s=new THREE.Scene(); s.background=new THREE.Color(0xe0e0e0); const cam=new THREE.PerspectiveCamera(45,w/h,0.1,100); cam.position.set(3,2,5); const r=new THREE.WebGLRenderer(); r.setSize(w,h); c.appendChild(r.domElement); r.shadowMap.enabled=true;
            const light=new THREE.DirectionalLight(0xffffff,1); light.position.set(5,10,7); s.add(light); s.add(new THREE.AmbientLight(0x404040));
            const group=new THREE.Group(); const mk=(w,h,d,c,x,y,z)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c})); m.position.set(x,y,z); m.castShadow=true; group.add(m); };
            mk(0.5,0.5,0.5,this._avatarColors.headColor,0,2.2,0); mk(0.6,0.8,0.4,this._avatarColors.torsoColor,0,1.5,0); mk(0.25,0.6,0.25,this._avatarColors.torsoColor,-0.45,1.6,0); mk(0.25,0.6,0.25,this._avatarColors.torsoColor,0.45,1.6,0); mk(0.25,0.6,0.25,this._avatarColors.legColor,-0.2,0.9,0); mk(0.25,0.6,0.25,this._avatarColors.legColor,0.2,0.9,0);
            s.add(group); let rotY=0; r.domElement.addEventListener('mousedown',e=>{ let px=e.clientX; const move=(me)=>{ rotY+=(me.clientX-px)*0.01; px=me.clientX; }; window.addEventListener('mousemove',move); window.addEventListener('mouseup',()=>window.removeEventListener('mousemove',move),{once:true}); });
            const animate=()=>{ requestAnimationFrame(animate); group.rotation.y=rotY; r.render(s,cam); }; animate();
        }
        _updateAvatarColor(prop,val){ if(Auth.sessionUser){ Auth.sessionUser.avatar[prop]=val; DB.updateUser(Auth.sessionUser.id,{avatar:Auth.sessionUser.avatar}); this._avatarColors[prop]=val; this._initAvatar3D(); } }
        _renderGameStudio(main){
            const user=Auth.sessionUser;
            const myGames = DB._data.userGames.filter(g=>g.authorId===user.id);
            main.innerHTML=`<div class="page active"><h2>🎨 Game Studio</h2><button class="btn btn-green" id="newGameBtn">+ New Game</button><div class="grid" style="margin-top:16px;">${myGames.map(g=>`
                <div class="card"><b>${g.name}</b><p>${g.description||''}</p><div class="flex"><button class="btn btn-white btn-sm" onclick="App.instance._editGame('${g.id}')">Edit</button><button class="btn btn-red btn-sm" onclick="App.instance._deleteGame('${g.id}')">Delete</button></div></div>
            `).join('')||'<div class="card">No games yet. Click "New Game" to start.</div>'}</div></div>`;
            document.getElementById('newGameBtn')?.addEventListener('click',()=>this._openGameEditor());
        }
        _openGameEditor(gameToEdit=null){
            const overlay=document.createElement('div'); overlay.className='modal-overlay';
            overlay.innerHTML=`<div class="modal" style="max-width:800px;"><h3>${gameToEdit?'Edit Game':'New Game'}</h3><input id="gameName" placeholder="Game Name" value="${gameToEdit?.name||''}"><textarea id="gameDesc" placeholder="Description">${gameToEdit?.description||''}</textarea><div style="margin:16px 0;"><strong>Level Editor (click cells: empty→coin→hazard)</strong><div id="editorGrid" class="grid-editor" style="max-height:300px;overflow:auto;"></div></div><div class="flex"><button id="saveGameBtn" class="btn btn-green">Publish Game</button><button id="closeEditor" class="btn btn-white">Cancel</button></div></div>`;
            document.body.appendChild(overlay);
            const gridSize=10; let cells=Array(gridSize).fill().map(()=>Array(gridSize).fill('empty'));
            if(gameToEdit){
                const gd=gameToEdit.gameData;
                gd.coins.forEach(c=>{ if(c.x>=0 && c.x<gridSize && c.z>=0 && c.z<gridSize) cells[c.x][c.z]='coin'; });
                gd.hazards.forEach(h=>{ if(h.x>=0 && h.x<gridSize && h.z>=0 && h.z<gridSize) cells[h.x][h.z]='hazard'; });
            }
            const gridContainer=overlay.querySelector('#editorGrid');
            function renderGrid(){
                gridContainer.innerHTML='';
                for(let i=0;i<gridSize;i++){
                    for(let j=0;j<gridSize;j++){
                        const cell=document.createElement('div');
                        cell.className=`grid-cell ${cells[i][j]}`;
                        if(cells[i][j]==='coin') cell.innerText='💰';
                        else if(cells[i][j]==='hazard') cell.innerText='💀';
                        else cell.innerText='⚪';
                        cell.addEventListener('click',(e)=>{
                            if(cells[i][j]==='empty'){ cells[i][j]='coin'; }
                            else if(cells[i][j]==='coin'){ cells[i][j]='hazard'; }
                            else{ cells[i][j]='empty'; }
                            renderGrid();
                        });
                        gridContainer.appendChild(cell);
                    }
                }
            }
            renderGrid();
            overlay.querySelector('#saveGameBtn').addEventListener('click',()=>{
                const name=overlay.querySelector('#gameName').value.trim();
                if(!name){ showToast('Game name required'); return; }
                const coins=[], hazards=[];
                for(let i=0;i<gridSize;i++){
                    for(let j=0;j<gridSize;j++){
                        if(cells[i][j]==='coin') coins.push({x:i-5,z:j-5});
                        else if(cells[i][j]==='hazard') hazards.push({x:i-5,z:j-5});
                    }
                }
                const gameData={ type:'collect', startPos:{x:0,z:0}, coins, hazards };
                const now=nowISO();
                if(gameToEdit){
                    const updated={...gameToEdit, name, description:overlay.querySelector('#gameDesc').value, gameData, updatedAt:now};
                    DB.updateGame(gameToEdit.id,updated);
                    showToast('Game updated!');
                }else{
                    const newGame={ id:uuid(), name, description:overlay.querySelector('#gameDesc').value, authorId:Auth.sessionUser.id, authorName:Auth.sessionUser.username, published:true, createdAt:now, gameData };
                    DB.addGame(newGame);
                    showToast('Game published!');
                }
                overlay.remove(); navigate('create');
            });
            overlay.querySelector('#closeEditor').addEventListener('click',()=>overlay.remove());
        }
        _editGame(gameId){ const game=DB._data.userGames.find(g=>g.id===gameId); if(game) this._openGameEditor(game); else showToast('error'); }
        _deleteGame(gameId){ if(confirm('Delete permanently?')){ DB.deleteGame(gameId); navigate('create'); showToast('Deleted'); } }
        _renderPlayGame(main){
            const id=new URLSearchParams(window.location.hash.split('?')[1]||'').get('id');
            const game=DB._data.userGames.find(g=>g.id===id);
            if(!game){ main.innerHTML='<div class="card">Game not found.</div>'; return; }
            main.innerHTML=`<div style="position:fixed;inset:0;top:56px;background:#000;z-index:500;"><div id="gameCanvas" style="width:100%;height:100%;"></div><div style="position:absolute;top:12px;left:12px;background:rgba(0,0,0,0.7);color:#fff;padding:8px;border-radius:8px;"><span id="scoreDisplay">Coins: 0/${game.gameData.coins.length}</span></div><div style="position:absolute;top:12px;right:12px;"><button style="background:rgba(0,0,0,0.7);color:white;padding:6px 12px;border:none;border-radius:6px;" onclick="navigate('home')">Exit</button></div><div style="position:absolute;bottom:12px;left:12px;color:white;background:rgba(0,0,0,0.5);padding:4px 8px;">WASD to move</div></div>`;
            setTimeout(()=>this._initGameplay(game), 100);
        }
        _initGameplay(game){
            const container=document.getElementById('gameCanvas'); if(!container||!window.THREE) return;
            const w=container.clientWidth, h=container.clientHeight;
            const scene=new THREE.Scene(); scene.background=new THREE.Color(0x87CEEB); scene.fog=new THREE.Fog(0x87CEEB,30,50);
            const camera=new THREE.PerspectiveCamera(70,w/h,0.5,100); camera.position.set(0,6,12);
            const renderer=new THREE.WebGLRenderer(); renderer.setSize(w,h); renderer.shadowMap.enabled=true; container.appendChild(renderer.domElement);
            const light=new THREE.DirectionalLight(0xfff5e6,1); light.position.set(10,20,5); light.castShadow=true; scene.add(light); scene.add(new THREE.AmbientLight(0x404060));
            const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x5a8a3c})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
            // grid helper
            const gridHelper=new THREE.GridHelper(30,20,0x88aa88,0x446644); gridHelper.position.y=0.01; scene.add(gridHelper);
            const player=new THREE.Mesh(new THREE.BoxGeometry(0.7,1.2,0.7),new THREE.MeshStandardMaterial({color:0x3498db})); player.position.set(0,0.6,0); player.castShadow=true; scene.add(player);
            const coinGroup=[], hazardGroup=[];
            game.gameData.coins.forEach(pos=>{
                const coin=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.2,0.6),new THREE.MeshStandardMaterial({color:0xf7ba2c,emissive:0x442200})); coin.position.set(pos.x,0.2,pos.z); coin.castShadow=true; scene.add(coin); coinGroup.push(coin);
            });
            game.gameData.hazards.forEach(pos=>{
                const hazard=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.4,0.8),new THREE.MeshStandardMaterial({color:0xe2231a})); hazard.position.set(pos.x,0.2,pos.z); hazard.castShadow=true; scene.add(hazard); hazardGroup.push(hazard);
            });
            let collected=0; const total=coinGroup.length; const scoreDiv=document.getElementById('scoreDisplay'); if(scoreDiv) scoreDiv.innerText=`Coins: 0/${total}`;
            const keys={}; window.addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; if(['w','a','s','d'].includes(e.key.toLowerCase())) e.preventDefault(); });
            window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
            let hasWon=false;
            const updateScore=()=>{ if(scoreDiv) scoreDiv.innerText=`Coins: ${collected}/${total}`; if(collected===total && !hasWon){ hasWon=true; showToast('🎉 YOU WIN! 🎉'); setTimeout(()=>navigate('home'),2000); } };
            const checkCollisions=()=>{
                for(let i=0;i<coinGroup.length;i++){ const c=coinGroup[i]; if(c && player.position.distanceTo(c.position)<0.7){ scene.remove(c); coinGroup[i]=null; collected++; updateScore(); } }
                for(let h of hazardGroup){ if(h && player.position.distanceTo(h.position)<0.8){ player.material.color.setHex(0xff6666); showToast('💀 You died! Restarting...'); setTimeout(()=>{ player.position.set(0,0.6,0); player.material.color.setHex(0x3498db); },300); break; } }
            };
            const animate=()=>{ requestAnimationFrame(animate); if(hasWon) return; let speed=0.12; let moveX=0, moveZ=0; if(keys['w']) moveZ-=speed; if(keys['s']) moveZ+=speed; if(keys['a']) moveX-=speed; if(keys['d']) moveX+=speed; let nx=player.position.x+moveX, nz=player.position.z+moveZ; if(Math.abs(nx)<13) player.position.x=nx; if(Math.abs(nz)<13) player.position.z=nz; checkCollisions(); camera.position.x=player.position.x; camera.position.z=player.position.z+8; camera.position.y=player.position.y+4; camera.lookAt(player.position); renderer.render(scene,camera); };
            animate();
            window.addEventListener('resize',()=>{ const nw=container.clientWidth,nh=container.clientHeight; renderer.setSize(nw,nh); camera.aspect=nw/nh; camera.updateProjectionMatrix(); });
        }
        _renderSettings(main){ const u=Auth.sessionUser; main.innerHTML=`<div class="page active"><div class="card"><h3>Account</h3><p>${u.username} ${u.verifiedBadge?'✓ Verified':''}</p><button class="btn btn-white" onclick="App.instance._requestVerification()">Request Verified Badge</button></div></div>`; }
        _requestVerification(){ const reason=prompt('Why should you be verified?'); if(reason) { DB.addVerificationRequest({id:'vr-'+uuid(),userId:Auth.sessionUser.id,username:Auth.sessionUser.username,reason,status:'pending',timestamp:nowISO()}); showToast('Request sent.'); } }
        _renderProfile(main){ const u=Auth.sessionUser; main.innerHTML=`<div class="page active"><div class="card"><h2>${u.displayName}</h2><p>Joined: ${new Date(u.created).toLocaleDateString()}</p><p>Games: ${DB._data.userGames.filter(g=>g.authorId===u.id).length}</p></div></div>`; }
        _renderFriends(main){ main.innerHTML=`<div class="card"><h3>Friends (coming soon)</h3></div>`; }
        _renderMessages(main){ main.innerHTML=`<div class="card"><h3>Messaging System</h3><p>Chat with friends feature</p></div>`; }
        _renderGroups(main){ main.innerHTML=`<div class="card"><h3>Groups</h3><p>Join communities</p></div>`; }
        _renderAdmin(main){ if(!Auth.isAdmin()){ main.innerHTML='<div class="card">Access Denied</div>'; return; } const vr=DB.getVerificationRequests().filter(v=>v.status==='pending'); const users=DB._data.users; main.innerHTML=`<div class="page active"><h2>Admin</h2><div class="tab-nav"><div class="tab active" onclick="App.instance._switchAdminTab('verif')">Verifications (${vr.length})</div><div class="tab" onclick="App.instance._switchAdminTab('users')">Users</div></div><div id="adminVerif">${vr.map(v=>`<div class="card"><b>${v.username}</b>: ${v.reason}<button class="btn btn-green btn-sm" onclick="App.instance._approveVerify('${v.id}','${v.userId}')">Approve</button><button class="btn btn-red btn-sm" onclick="App.instance._denyVerify('${v.id}')">Deny</button></div>`).join('')}</div><div id="adminUsers" style="display:none;">${users.map(u=>`<div class="card">${u.username} ${u.isAdmin?'[ADMIN]':''} <button onclick="App.instance._toggleMod('${u.id}')">${u.isModerator?'Remove Mod':'Make Mod'}</button></div>`).join('')}</div></div>`; }
        _switchAdminTab(tab){ const v=document.getElementById('adminVerif'), u=document.getElementById('adminUsers'); if(tab==='verif'){ if(v)v.style.display='block'; if(u)u.style.display='none';} else{ if(v)v.style.display='none'; if(u)u.style.display='block';} }
        _approveVerify(vrid,uid){ DB.updateVerificationRequest(vrid,{status:'approved'}); DB.updateUser(uid,{verifiedBadge:true}); showToast('Verified!'); navigate('admin'); }
        _denyVerify(vrid){ DB.updateVerificationRequest(vrid,{status:'denied'}); showToast('Denied'); navigate('admin'); }
        _toggleMod(uid){ const u=DB.getUser(uid); if(u){ DB.updateUser(uid,{isModerator:!u.isModerator}); showToast(u.isModerator?'Mod removed':'Mod added'); navigate('admin'); } }
        _renderModeration(main){ main.innerHTML=`<div class="card"><h3>Mod Queue (reports placeholder)</h3></div>`; }
    }
    window.navigate=navigate; window.Auth=Auth; DB.init(); Auth.init(); App.instance=new App(); window.App=App;
})();
</script>
